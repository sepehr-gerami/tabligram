<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<title>banner mobile design</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #111; }
  #banner {
    position: relative;
    width: 720px;
    height: 960px;
    overflow: hidden;
    background:
      radial-gradient(620px 480px at 100% 100%, rgba(236, 72, 153, .6), transparent 62%),
      radial-gradient(540px 420px at 0% 0%, rgba(168, 85, 247, .7), transparent 65%),
      linear-gradient(160deg, #2e1065 0%, #6b21a8 48%, #be185d 100%);
    color: #fff;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
  }
  .dots {
    position: absolute; inset: 0; opacity: .12;
    background-image: radial-gradient(#fff 1.3px, transparent 1.3px);
    background-size: 24px 24px;
  }
  .glow {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);
    filter: blur(8px);
  }
  .glow.a { top: -160px; right: -120px; }
  .glow.b { bottom: 120px; left: -180px; }
  .content {
    position: relative; z-index: 3;
    padding: 70px 56px 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 18px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: 999px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.3);
    font-size: 21px; font-weight: 700;
    backdrop-filter: blur(8px);
  }
  h1 {
    margin: 0; font-size: 92px; line-height: 1.06; font-weight: 900;
    letter-spacing: -2px;
    text-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .sub {
    margin: 0; font-size: 26px; line-height: 1.8; color: rgba(255,255,255,.92);
    max-width: 590px;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .code {
    display: inline-flex; align-items: center; gap: 10px;
    background: #fff; color: #4c1d95;
    border-radius: 16px; padding: 12px 20px;
    font-size: 21px; font-weight: 800;
    box-shadow: 0 16px 40px rgba(0,0,0,.25);
  }
  .code b { font-size: 27px; letter-spacing: 2px; }
  .handle {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 18px; border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3);
    font-size: 22px; font-weight: 700; direction: ltr;
    backdrop-filter: blur(8px);
  }
  .ring {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
    display: grid; place-items: center;
  }
  .ring i { width: 24px; height: 24px; border-radius: 50%; background: #fff; display: block; }
  .phone-wrap {
    position: absolute; left: 50%; bottom: -150px; z-index: 2;
    transform: translateX(-50%) rotate(-4deg);
    filter: drop-shadow(0 34px 60px rgba(0,0,0,.42));
  }
  .phone {
    width: 330px; height: 600px; border-radius: 48px;
    background: #0b0b12; padding: 12px;
    border: 2px solid rgba(255,255,255,.32);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden;
    background:
      radial-gradient(340px 260px at 80% 0%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(160deg, #7c3aed 0%, #db2777 60%, #f97316 100%);
  }
  .story-top { display: flex; align-items: center; gap: 10px; padding: 22px 18px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
    display: grid; place-items: center;
  }
  .avatar i { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: block; }
  .story-name { font-size: 16px; font-weight: 700; direction: ltr; }
  .story-sub { font-size: 11px; color: rgba(255,255,255,.8); direction: ltr; }
  .story-body {
    position: absolute; inset: 96px 18px 110px;
    border-radius: 24px; background: rgba(0,0,0,.2);
    border: 1px solid rgba(255,255,255,.22);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 22px;
  }
  .story-body .big { font-size: 36px; font-weight: 900; line-height: 1.35; }
  .story-body .small { font-size: 17px; color: rgba(255,255,255,.88); line-height: 1.8; }
  .story-body .tag { margin-top: 4px; font-size: 16px; font-weight: 800; padding: 7px 14px; border-radius: 999px; background: #fff; color: #7c3aed; }
  .story-foot { position: absolute; left: 18px; right: 18px; bottom: 22px; display: flex; align-items: center; gap: 8px; }
  .story-foot .line { height: 3px; flex: 1; border-radius: 3px; background: rgba(255,255,255,.85); }
  .story-foot .send { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center; font-size: 16px; }
  .badge {
    position: absolute; z-index: 4; right: 44px; bottom: 150px;
    background: #fff; color: #4c1d95; border-radius: 16px;
    padding: 13px 20px; font-size: 19px; font-weight: 900;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    transform: rotate(-3deg);
  }
</style>
</head>
<body>
  <div id="banner" role="img" tabindex="0" aria-label="بنر موبایل تخفیف ویژه تبلیگرام">
    <div class="dots"></div>
    <div class="glow a"></div>
    <div class="glow b"></div>

    <div class="content">
      <span class="pill">✦ پیشنهاد ویژه تبلیگرام</span>
      <h1>تخفیف ویژه</h1>
      <p class="sub">اولین کمپین تبلیغاتی خود را با ۲۰٪ تخفیف ثبت کنید و انتشار را در چندین پیج اینستاگرام دنبال کنید.</p>
      <div class="row">
        <span class="code">کد تخفیف: <b>TECH20</b></span>
        <span class="handle"><span class="ring"><i></i></span>@tech_negar</span>
      </div>
    </div>

    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="story-top">
            <span class="avatar"><i></i></span>
            <div>
              <div class="story-name">tech_negar</div>
              <div class="story-sub">sponsored story</div>
            </div>
          </div>
          <div class="story-body">
            <div class="big">استوری<br />تبلیغاتی</div>
            <div class="small">دیده شدن برند شما در پیج‌های تخصصی</div>
            <div class="tag">همین حالا شروع کن</div>
          </div>
          <div class="story-foot">
            <span class="line"></span>
            <span class="send">➤</span>
          </div>
        </div>
      </div>
    </div>

    <div class="badge">۱۰٪ کمیسیون شفاف پلتفرم</div>
  </div>
</body>
</html>
